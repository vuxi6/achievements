<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحتي الشخصية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background-color: #fefaf6;
      color: #2f2f2f;
      scroll-behavior: smooth;
    }

    nav {
      background-color: #fffaf3;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 15px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: #c5a46d;
    }

    header {
      background: linear-gradient(135deg, #f6e6cc, #f3d8b6);
      padding: 100px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      font-weight: 700;
      color: #2b2b2b;
    }

    header h2 {
      font-size: 1.2rem;
      color: #6b6b6b;
      margin-bottom: 25px;
    }

    section {
      padding: 80px 20px;
      text-align: center;
      max-width: 800px;
      margin: auto;
    }

    footer {
      background-color: #2b2b2b;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      font-size: 0.9rem;
    }
    .my-animation {
  animation: fade-in 0.3s ease-out;
    }

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">النبذة</a>
    <a href="achievements.html">الإنجازات</a>
    <a href="tasks.html">المهمات المدرسية</a>
    <a href="contact.html">تواصل معي</a>
  </nav>

  <header class="my-animation">
    <h1>فاطمة العسيري</h1>
    <h2>اهلًا بكم</h2>
  </header>

  <section>
    <h3>نبذة</h3>
    <p>اهتماماتي بسيطة ولكنها غالبًا تتمحور حول اشياء تطبيقية او حاسوبية<br> وايضًا احب الدراسة جدًا ولكني مكروفة بزيادة</p>
  </section>

  <footer>
    <p></p>
  </footer>

</body>
</html>
