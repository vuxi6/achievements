<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background-color: #fefaf6;
      color: #2f2f2f;
    }

    nav {
      background-color: #fffaf3;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 15px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: #c5a46d;
    }

    section {
      padding: 80px 20px;
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: 'Tajawal', sans-serif;
    }

    button {
      background-color: #2b2b2b;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #444;
    }

    footer {
      background-color: #2b2b2b;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">النبذة</a>
    <a href="achievements.html">الإنجازات</a>
    <a href="tasks.html">المهمات المدرسية</a>
    <a href="contact.html">تواصل معي</a>
  </nav>

  <section>
    <h3>تواصل معي</h3>
    <p></p>
    <form>
      <input type="text" placeholder="الاسم">
      <input type="email" placeholder="البريد الإلكتروني">
      <textarea rows="5" placeholder="الرسالة"></textarea>
      <button type="submit">إرسال</button>
    </form>
  </section>

  <footer>
    <p></p>
  </footer>

</body>
</html>
